name: Weekly release rehearsal

on:
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * 0'

permissions:
  contents: read

concurrency:
  group: weekly-release-rehearsal
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'krmisystems/fantasy-football-manager'
    uses: ./.github/workflows/ci.yml
