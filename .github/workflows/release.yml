name: Reviewed PyPI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from the reviewed release commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.11'
      - run: uv sync --locked --dev
      - run: uv run pytest -q
      - run: uv run fantasy-football-manager --demo --data-dir .ci-demo
      - name: Validate release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: uv run python scripts/validate_release.py --version "$RELEASE_VERSION"
      - run: uv build
      - run: uv run python -m twine check "dist/*.whl" "dist/*.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fantasy-football-manager/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish through the configured PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
