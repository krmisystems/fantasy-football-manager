name: Reviewed PyPI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from the reviewed release commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      release_version: ${{ inputs.version }}
  publish:
    needs: verify
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fantasy-football-manager/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution-files
          path: artifacts/
      - name: Select tested Python distributions
        shell: bash
        run: |
          mkdir dist
          cp artifacts/*.whl artifacts/*.tar.gz dist/
      - name: Publish through the configured PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
