name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        description: Validate this exact version before creating release artifacts
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest -q
      - run: uv run fantasy-football-manager --demo --data-dir .ci-demo
      - run: uv run python scripts/validate_release.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: uv sync --locked --dev
      - run: uv run playwright install --with-deps chrome
      - run: uv run pytest -q tests/test_browser_integration.py tests/test_season_browser_integration.py tests/test_espn_public_draft_integration.py
        env:
          FFM_BROWSER_TESTS: '1'
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Verify packaged UI matches its source
        run: test -z "$(git status --porcelain -- src/fantasy_football_manager/dashboard_static)"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: uv sync --locked --dev
      - run: uv run playwright install --with-deps chrome
      - run: uv run pytest -q tests/test_dashboard_browser.py
        env:
          FFM_DASHBOARD_BROWSER_TESTS: '1'
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ffm_test
          POSTGRES_USER: ffm_test
          # This credential belongs only to the disposable CI service.
          POSTGRES_PASSWORD: fixture-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ffm_test -d ffm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra server --dev
      - run: uv run pytest -q tests/test_archive.py tests/test_archive_incremental.py tests/test_archive_compaction.py
        env:
          FFM_ARCHIVE_TEST_DSN: host=127.0.0.1 port=5432 dbname=ffm_test user=ffm_test password=fixture-only-password
  package:
    needs: [test, browser, postgres, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'
      - run: uv sync --locked --dev
      - name: Validate requested release version
        if: ${{ inputs.release_version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: uv run python scripts/validate_release.py --version "$RELEASE_VERSION"
      - run: uv build
      - run: uv run python -m twine check "dist/*.whl" "dist/*.tar.gz"
      - run: uv run python scripts/build_plugin_zip.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-files
          path: dist/
          if-no-files-found: error
      - name: Download the packaged release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-files
          path: downloaded-artifacts/
      - name: Verify downloaded release artifacts
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import hashlib
          # uv build creates a hidden .gitignore; artifact uploads exclude hidden files.
          original = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in Path("dist").iterdir() if p.is_file() and not p.name.startswith(".")}
          downloaded = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in Path("downloaded-artifacts").iterdir() if p.is_file() and not p.name.startswith(".")}
          assert len(original) == 4, "Expected the wheel, source archive, plugin archive, and plugin manifest"
          assert original == downloaded, "Downloaded release artifacts differ from the package job outputs"
          print("Verified all four artifact downloads against package job outputs.")
          PY
