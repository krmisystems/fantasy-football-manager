name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest -q
      - run: uv run fantasy-football-manager --demo --data-dir .ci-demo
      - run: uv run python scripts/validate_release.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
      - run: uv sync --locked --dev
      - run: uv run playwright install --with-deps chrome
      - run: uv run pytest -q tests/test_browser_integration.py tests/test_season_browser_integration.py
        env:
          FFM_BROWSER_TESTS: '1'
  package:
    needs: [test, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.11'
      - run: uv sync --locked --dev
      - run: uv build
      - run: uv run python -m twine check "dist/*.whl" "dist/*.tar.gz"
      - run: uv run python scripts/build_plugin_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-files
          path: dist/
          if-no-files-found: error
