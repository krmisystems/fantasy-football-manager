name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        description: Validate this exact version before creating release artifacts
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest -q
      - run: uv run fantasy-football-manager --demo --data-dir .ci-demo
      - run: uv run python scripts/validate_release.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
      - run: uv sync --locked --dev
      - run: uv run playwright install --with-deps chrome
      - run: uv run pytest -q tests/test_browser_integration.py tests/test_season_browser_integration.py tests/test_espn_public_draft_integration.py
        env:
          FFM_BROWSER_TESTS: '1'
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ffm_test
          POSTGRES_USER: ffm_test
          # This credential belongs only to the disposable CI service.
          POSTGRES_PASSWORD: fixture-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ffm_test -d ffm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra server --dev
      - run: uv run pytest -q tests/test_archive.py
        env:
          FFM_ARCHIVE_TEST_DSN: host=127.0.0.1 port=5432 dbname=ffm_test user=ffm_test password=fixture-only-password
  package:
    needs: [test, browser, postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.11'
      - run: uv sync --locked --dev
      - name: Validate requested release version
        if: ${{ inputs.release_version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: uv run python scripts/validate_release.py --version "$RELEASE_VERSION"
      - run: uv build
      - run: uv run python -m twine check "dist/*.whl" "dist/*.tar.gz"
      - run: uv run python scripts/build_plugin_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-files
          path: dist/
          if-no-files-found: error
